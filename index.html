  <nav class="main-nav">

    

        <a
          href="#hero"
          class="nav-link"
          data-slide="hero">

          Hero Section

        </a>

      

        <a
          href="#about"
          class="nav-link"
          data-slide="about">

          About Us

        </a>

      

        <a
          href="#services"
          class="nav-link"
          data-slide="services">

          Our Services

        </a>

      

        <a
          href="#testimonials"

  </nav>

</header>


<main>

  

<section
  id="hero"
  class="site-slide hero-slide"
  data-index="0">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        01
      </span>

      <h2>
        Hero Section
      </h2>

      

      
            <button
              class="primary-btn"
              data-next>

              Explore More
              <span>→</span>

            </button>
          

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/6392833/pexels-photo-6392833.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="A personal trainer assists a woman doing sit-ups with a medicine ball in a gym setting."
              loading="eager"
            >

          </div>

        


  </div>


  


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="about"
  class="site-slide content-slide"
  data-index="1">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        02
      </span>

      <h2>
        About Us
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/17201700/pexels-photo-17201700.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="A topless man with short hair leaning on a barbell in a dimly lit gym, showcasing fitness and muscle."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="services"
  class="site-slide content-slide"
  data-index="2">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        03
      </span>

      <h2>
        Our Services
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/39219660/pexels-photo-39219660.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="A personal trainer discusses workout plans with a client at a gym."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

      

</section>

        

<section
  id="testimonials"
  class="site-slide content-slide"
  data-index="3">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        04
      </span>

      <h2>
        Client Testimonials
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"
              src="https://images.pexels.com/photos/13106621/pexels-photo-13106621.jpeg?auto=compress&amp;cs=tinysrgb&amp;h=650&amp;w=940"
              alt="A large group of diverse adults smiling and posing together in a gym setting."
              loading="lazy"
            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

      


  

        <button
          class="slide-arrow next"
          data-next
          aria-label="Next slide">

          ↓

        </button>

<section
  id="contact"

  data-index="4">

  <div class="slide-overlay"></div>

  <div class="slide-container">

    <div class="slide-content">

      <span class="slide-number">
        05
      </span>

      <h2>
        Contact Us
      </h2>

      

      

    </div>


    

          <div class="slide-image-wrapper">

            <img
              class="slide-image"

            >

          </div>

        


  </div>


  

        <button
          class="slide-arrow prev"
          data-prev
          aria-label="Previous slide">

          ↑

        </button>

</main>


<div class="slide-dots">

  

        <button
          class="dot active"
          data-target="hero"
          aria-label="Go to Hero Section">
        </button>

      

        <button
          class="dot "
          data-target="about"
          aria-label="Go to About Us">
        </button>

      

        <button
          class="dot "
          data-target="services"
          aria-label="Go to Our Services">
        </button>

      

        <button
          class="dot "
          data-target="testimonials"
          aria-label="Go to Client Testimonials">
        </button>

      

        <button
          class="dot "
          data-target="contact"
          aria-label="Go to Contact Us">
        </button>

      

</div>


<footer class="site-footer">

  

<div class="footer-contact">
